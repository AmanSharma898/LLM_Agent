name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint, type-check and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: mypy
        run: mypy
      - name: pytest
        run: pytest

  regression-demo:
    name: Non-regression demo
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Baseline agent (v1) must pass
        run: >
          llm-eval run examples/suites/eval_assistant.yaml
          --agent demo:v1 --baselines examples/baselines
          --markdown reports/v1.md --fail-on-missing
      - name: Changed agent (v2) must be flagged as a regression
        run: |
          if llm-eval run examples/suites/eval_assistant.yaml \
               --agent demo:v2 --baselines examples/baselines --markdown reports/v2.md; then
            echo "::error::The v2 behaviour change was not detected"
            exit 1
          fi
      - name: Publish reports to the job summary
        if: always()
        run: cat reports/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-reports
          path: reports/
